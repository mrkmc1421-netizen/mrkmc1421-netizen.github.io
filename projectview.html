<!DOCTYPE html>
<html>
<head>
  <title>DolphinMod Project Viewer</title>
</head>

<body>
  <h1 id="title"></h1>

  <button id="runBtn">Run ▶</button>

  <script src="scriptbuilder.js"></script>
  <script src="runtime/vm.js"></script>
  <script src="runtime/renderer.js"></script>

  <script>
    const id = new URLSearchParams(window.location.search).get("id");
    const projects = JSON.parse(localStorage.getItem("dolphinCommunity") || "[]");
    const project = projects[id];

    document.getElementById("title").textContent = project.name;

    document.getElementById("runBtn").addEventListener("click", () => {
      DolphinVM.run(project.program);
    });
  </script>
</body>
  </html>
const analytics = JSON.parse(localStorage.getItem("dolphinAnalytics") || "{}");
analytics.views = analytics.views || [];
analytics.views.push(Date.now());
localStorage.setItem("dolphinAnalytics", JSON.stringify(analytics));
<h2>Comments</h2>

<div id="commentList"></div>

<input id="commentInput" placeholder="Write a comment...">
<button id="commentBtn">Post</button>

<script src="comments.js"></script>

<script src="emotes.js"></script>

  renderEmotePicker();
