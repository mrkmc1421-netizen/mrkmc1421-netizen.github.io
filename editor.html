<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>DolphinMod Editor 🐬</title>
  <style>
    body {
      margin: 0;
      background: #003;
      color: #fff;
      font-family: system-ui;
      display: grid;
      grid-template-columns: 260px 1fr;
      height: 100vh;
    }
    #sidebar {
      background: #024;
      padding: 12px;
      border-right: 2px solid #0af;
    }
    #sidebar h2 {
      margin-top: 0;
    }
    .block {
      background: #0af;
      color: #003;
      padding: 8px;
      <button id="createSprite">Create Sprite</button>
      border-radius: 8px;
      margin-bottom: 8px;
      cursor: grab;
    }
    #editor {
      background: #001;
      position: relative;
    }
    #stage {
      width: 480px;
      height: 360px;
      background: radial-gradient(circle at top, #0ff, #004);
      border-radius: 16px;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 40px #0ff6;
    }
  </style>
</head>
<body>

<div id="sidebar">
  <h2>Blocks 🐬</h2>
  <div class="block">splash (INTENSITY)</div>
  <div class="block">sonar (FREQ)</div>
</div>

<div id="editor">
  <div id="stage"></div>
</div>

</body>
    </html>
<button id="createSprite">Create Sprite</button>
<div id="categories">
  <button data-cat="scratch">Scratch</button>
  <button data-cat="penguinmod">PenguinMod</button>
  <button data-cat="dolphinmod">DolphinMod</button>
  <button data-cat="sprites">Sprites</button>
    </div>
<button id="runButton" class="icon-btn">
  <img src="assets/sea_start.png" alt="Start">
</button>

<button id="stopButton" class="icon-btn">
  <img src="assets/sea_stop.png" alt="Stop">
</button>
<a href="publish.html">
  <button id="publishBtn">Publish To Community 🌊</button>
  </a>
const user = localStorage.getItem("dolphinUser");
document.getElementById("userDisplay").textContent = "Signed in as: " + user;
